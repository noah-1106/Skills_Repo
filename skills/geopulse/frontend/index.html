<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>GeoPulse · GEO 交付工作台</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/echarts.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主工作区</a>
  <div id="login-view" class="login-view" hidden></div>
  <div id="app-shell" class="app-shell" hidden>
    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <div class="brand-mark"><span class="brand-symbol" aria-hidden="true">G</span><div><strong>GeoPulse</strong><small>GEO 交付工作台</small></div></div>
      <nav id="main-nav"></nav>
      <div class="sidebar-foot"><span class="status-dot"></span>自托管 · 单机工作队列<small>数据与密钥保存在当前部署环境</small></div>
    </aside>
    <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="关闭导航" tabindex="-1" hidden></button>
    <div class="shell-main">
      <header class="topbar">
        <button id="menu-button" class="icon-button mobile-only" aria-label="打开导航" aria-expanded="false">☰</button>
        <div id="project-switcher" class="project-switcher"></div>
        <div class="topbar-spacer"></div>
        <span id="role-label" class="quiet-label"></span>
        <button id="logout-button" class="text-button">退出登录</button>
      </header>
      <div id="protocol-band" class="protocol-band" aria-label="当前测量口径"></div>
      <main id="workspace" tabindex="-1">
        <div class="page-loading" role="status"><span class="loading-line"></span>正在读取项目工作区…</div>
      </main>
    </div>
  </div>
  <div id="drawer-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><div class="noscript">GeoPulse 需要启用 JavaScript 才能管理工作流。</div></noscript>
</body>
</html>
